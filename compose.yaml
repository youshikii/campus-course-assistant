services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: backend
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - chroma_data:/data
volumes:
  mysql_data:
  chroma_data:
